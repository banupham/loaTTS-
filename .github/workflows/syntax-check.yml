name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m py_compile app.py run.py stable_runtime.py load_shed_runtime.py pipeline_runtime.py prosody_runtime.py speed_patch.py emoji_patch.py tail_guard.py
